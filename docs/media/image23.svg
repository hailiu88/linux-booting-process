><text id="text201" transform="matrix(21.2335 0 0 19.4744 7823.45 1164.74)"><tspan x="24.2988" y="78.2076">set stack address based </tspan><tspan x="24.2988" y="93.2076">on boot mode</tspan></text><text id="text202" transform="matrix(21.2335 0 0 19.4744 6672.48 1856.35)"><tspan x="24.2988" y="117.461">reserve memory for global_data(gd), using </tspan><tspan x="24.2988" y="132.461">routine board_init_f_alloc_reserve</tspan></text><text id="text203" transform="matrix(21.2335 0 0 19.4744 6414.5 2584.37)"><tspan x="11.2148" y="155.778">initialize gd pointer,clear global_data, initialize pointer </tspan><tspan x="11.2148" y="170.778">for early malloc, using board_init_f_init_reserve</tspan></text><text id="text204" transform="matrix(21.2335 0 0 19.4744 -1443.87 218.315)"><tspan x="423.365" y="359.516">calll board_init_f to initialize hardware</tspan></text><text id="text205" transform="matrix(21.2335 0 0 19.4744 1532.79 1091.93)"><tspan x="402.805" y="366.059">board_init_f functions are different for SPL, TPL, </tspan><tspan x="402.805" y="381.059">and proper, board_init_f for proper is defined in </tspan><tspan x="402.805" y="396.059">file common/board_f.c</tspan></text><text id="text206" transform="matrix(17.2889 0 0 19.4744 -4041.44 655.124)"><tspan x="382.242" y="413.723">switch stack from SRAM to DDR</tspan></text><text id="text207" transform="matrix(25.3824 0 0 19.4744 -7254.37 1819.95)"><tspan x="390.654" y="421.2">set pd pointer to the </tspan><tspan x="390.654" y="436.2">new RAM address</tspan></text><text id="text208" transform="matrix(21.2335 0 0 19.4744 -6285.9 2111.16)"><tspan x="410.281" y="482.881">calcuate new return address </tspan><tspan x="410.281" y="497.881">(address to label "here")</tspan></text><text id="text209" transform="matrix(21.2335 0 0 19.4744 -6266.05 3712.79)"><tspan x="392.523" y="468.822">relocate code from SRAM to RAM </tspan><tspan x="392.523" y="484.716">（source address in R9, </tspan><tspan x="392.523" y="499.716">destination  address in R0)</tspan></text><text id="text210" transform="matrix(21.2335 0 0 19.4744 -5849.32 3730.99)"><tspan x="401.869" y="552.04">move the vector table </tspan><tspan x="401.869" y="567.04">from SRAM to RAM</tspan></text><text id="text211" transform="matrix(21.2335 0 0 19.4744 1691.54 2020.15)"></text><text id="text212" transform="matrix(21.2335 0 0 19.4744 -6404.96 4768.42)"><tspan x="405.607" y="579.143">execute c_runtime_cpu_setup, if </tspan><tspan x="405.607" y="594.143">I-CACHE enabled, invalidate I-</tspan><tspan x="405.607" y="609.143">CACHE, return address of label </tspan><tspan x="405.607" y="624.002"><tspan dx="0 7.416 6.76799 4.716 6.76799">here </tspan></tspan></text><text id="text213" transform="matrix(21.2335 0 0 19.4744 -5194.46 6570.26)"><tspan x="404.674" y="657.647">turn on LED</tspan></text><text id="text214" transform="matrix(21.2335 0 0 19.4744 -6365.27 10192.1)"><tspan x="402.805" y="515.592">if CONFIG_SPL_BUILD not defined, </tspan><tspan x="402.805" y="530.592">that is, for proper mode </tspan></text><text id="text215" transform="matrix(21.2335 0 0 19.4744 -927.915 8099.09)"><tspan x="422.43" y="628.676">save gd address to R9, entry </tspan><tspan x="422.43" y="643.676">address ot u-boot to R1</tspan></text><text id="text216" transform="matrix(21.2335 0 0 19.4744 -114.296 9354.92)"><tspan x="420.561" y="624.938">call board_init_r</tspan></text><text id="text217" transform="matrix(21.2335 0 0 19.4745 4340.24 5300.33)"><tspan x="432.711" y="638.022">clear .BSS section</tspan></text><text id="text1" transform="matrix(16.3436 0 0 19.4745 5810.33 5955.55)"><tspan x="442.057" y="641.76">switch heap  from SRAM to RAM</tspan></text><text id="text36" transform="matrix(21.2335 0 0 19.4745 5669.82 6501.56)"><tspan x="392.523" y="643.629">used for SPL/TPL</tspan></text><text id="text37" transform="matrix(21.2335 0 0 19.4745 3228.95 8485.41)"><tspan x="406.543" y="661.385">used for proper or SPL/xPL framework</tspan></text></g></svg>